name: atlas-steps
title: Atlas numbered steps
description: Editorial how-it-works list with hairline rules and tabular numbers
category: content
tags:
    - steps
    - how-it-works
    - atlas
    - process

fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "How it works"

    heading:
        type: text
        label: Heading
        default: "Three steps to transform your workflow"
        required: true

    steps:
        type: repeater
        label: Steps
        add_button_label: Add step
        sub_fields:
            number:
                type: text
                label: Number
                default: "01"
            title:
                type: text
                label: Title
                default: "Step title"
            description:
                type: textarea
                label: Description
                default: "Describe this step."
        default:
            - number: "01"
              title: "Connect your tools"
              description: "Link your existing services in minutes. Atlas integrates with 50+ platforms seamlessly."
            - number: "02"
              title: "Configure & customize"
              description: "Set up automated workflows, define triggers, and tailor everything to your team's needs."
            - number: "03"
              title: "Scale with confidence"
              description: "Monitor performance with real-time analytics. Grow without worrying about infrastructure."
