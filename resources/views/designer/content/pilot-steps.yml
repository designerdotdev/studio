name: pilot-steps
title: Pilot how it works
description: A sticky heading column beside numbered steps, threaded on a hairline rail
category: content
tags:
    - steps
    - pilot
    - how-it-works
    - process

fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "How it works"

    heading:
        type: text
        label: Heading
        default: "Fifteen lines, then it runs itself."
        required: true

    text:
        type: textarea
        label: Supporting copy
        rows: 4
        default: "You already know what the agent should do. Pilot handles the parts that make it survive production — the retries, the checkpoints, the approvals, and the record of what happened."

    link_text:
        type: text
        label: Link text
        description: Clear to hide.
        default: "Read the loop guide"

    link_url:
        type: url
        label: Link
        default: "/designing-an-agent-loop"

    items:
        type: repeater
        label: Steps
        add_button_label: Add step
        sub_fields:
            number:
                type: text
                label: Number
                default: "04"
            title:
                type: text
                label: Title
                default: "New step"
            text:
                type: textarea
                label: Description
                rows: 3
                default: "What happens at this step."
            meta:
                type: text
                label: Meta line
                default: "Takes about a minute"
        default:
            - number: "01"
              title: "Describe the agent"
              text: "A name, a goal, and the tools it may call. Pilot infers the schema from your function signatures, so the model only ever sees arguments that type-check."
              meta: "About fifteen lines"
            - number: "02"
              title: "Let the loop run"
              text: "Pilot plans, calls tools, checkpoints after every step, and retries the ones that fail. Long runs park themselves waiting on a human instead of dying at the timeout."
              meta: "Minutes, hours, or days"
            - number: "03"
              title: "Read the trace, then ship"
              text: "Every decision, every argument, every token is recorded. Replay a run against a new prompt or a cheaper model and diff the two before you change anything."
              meta: "Before it reaches production"
