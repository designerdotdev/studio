name: basic-newsletter-01
title: Basic Newsletter 01
description: Centered heading and text with an email input and subscribe button
category: newsletter
tags:
    - basic
    - newsletter
    - signup

fields:
    heading:
        type: text
        label: Heading
        default: "Stay in the loop"
        required: true

    text:
        type: textarea
        label: Text
        description: Short line under the heading. Clear to hide.
        default: "One email a month with what shipped, what changed, and one workflow worth stealing. That's it."

    input_placeholder:
        type: text
        label: Input placeholder
        default: "you@company.com"

    button_text:
        type: text
        label: Button text
        default: "Subscribe"

    fine_print:
        type: text
        label: Fine print
        description: Small line under the form. Clear to hide.
        default: "No spam. Unsubscribe any time."
