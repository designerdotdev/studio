name: cta-panel
title: Dark CTA panel
description: Rounded dark panel with a glow accent, dot grid, and centered actions
category: cta
tags:
    - cta
    - dark
    - panel

fields:
    heading:
        type: text
        label: Heading
        default: "Stop answering the same email twice"
        required: true

    text:
        type: textarea
        label: Supporting text
        default: "Every thread gets one owner the moment it lands, so replies never collide and nothing sits unanswered over the weekend."

    button_text:
        type: text
        label: Primary button text
        default: "Start your free trial"

    button_link:
        type: url
        label: Primary button link
        default: "#"

    button_text_2:
        type: text
        label: Secondary button text
        description: Clear to hide.
        default: "Watch a 3-minute demo"

    button_link_2:
        type: url
        label: Secondary button link
        default: "#"

    glow_color:
        type: colorpicker
        label: Glow color
        default: "#4c7dfa"
