name: cta-split
title: Split call to action
description: Heading and text beside stacked buttons with reassurance bullets
category: cta
tags:
    - cta
    - split
    - checklist

fields:
    heading:
        type: text
        label: Heading
        default: "Switch your whole team this week"
        required: true

    text:
        type: textarea
        label: Supporting text
        default: "Import from Zendesk, Front, or a shared Gmail in one afternoon. We carry over your macros, tags, and full conversation history — nothing gets left behind."

    button_text:
        type: text
        label: Primary button text
        default: "Start free migration"

    button_link:
        type: url
        label: Primary button link
        default: "#"

    button_text_2:
        type: text
        label: Secondary button text
        description: Clear to hide.
        default: "Book a walkthrough"

    button_link_2:
        type: url
        label: Secondary button link
        default: "#"

    bullets:
        type: repeater
        label: Reassurance bullets
        add_button_label: Add bullet
        sub_fields:
            text:
                type: text
                label: Text
                default: "Bullet"
        default:
            - text: "Free concierge import from your current tool"
            - text: "No per-seat charge for read-only teammates"
            - text: "Cancel anytime and take your data with you"
