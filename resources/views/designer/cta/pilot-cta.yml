name: pilot-cta
title: Pilot closing CTA
description: The final ask on a hairline-topped band — headline left, everything you act on to the right
category: cta
tags:
    - cta
    - pilot
    - closing
    - asymmetric

fields:
    heading:
        type: text
        label: Heading
        default: "Your first agent, running by lunch."
        required: true

    text:
        type: textarea
        label: Supporting copy
        rows: 3
        default: "The runtime is open source and the docs are short. Install it, wire up one tool, and watch the first trace come back."

    button_1_text:
        type: text
        label: Primary button text
        default: "Get started"

    button_1_link:
        type: url
        label: Primary button link
        default: "/pricing"

    button_2_text:
        type: text
        label: Secondary button text
        description: Clear to hide.
        default: "Talk to us"

    button_2_link:
        type: url
        label: Secondary button link
        default: "mailto:hello@pilot.dev"

    note:
        type: text
        label: Footnote
        description: Clear to hide.
        default: "Apache 2.0 · No account needed to start · Bring your own models"
