name: cta-section
title: Simple call to action
description: Centered heading, supporting text, and a pair of buttons
category: cta
tags:
    - cta
    - centered
    - simple

fields:
    heading:
        type: text
        label: Heading
        default: "Ready when you are"
        required: true

    text:
        type: textarea
        label: Supporting text
        default: "Start on the free plan and invite your team when it clicks. Most teams are answering from one shared inbox by the end of the week."

    button_text:
        type: text
        label: Primary button text
        default: "Create your workspace"

    button_link:
        type: url
        label: Primary button link
        default: "#"

    button_text_2:
        type: text
        label: Secondary button text
        description: Clear to hide.
        default: "Talk to sales"

    button_link_2:
        type: url
        label: Secondary button link
        default: "#"

    footnote:
        type: text
        label: Footnote
        description: Clear to hide.
        default: "Setup takes about four minutes."
