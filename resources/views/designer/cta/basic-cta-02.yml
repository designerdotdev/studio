name: basic-cta-02
title: Basic CTA 02
description: Split row with heading on the left and buttons on the right
category: cta
tags:
    - basic
    - cta
    - split
    - buttons

fields:
    heading:
        type: text
        label: Heading
        default: "Ready when you are"
        required: true

    text:
        type: textarea
        label: Supporting text
        description: Short line under the heading. Clear to hide.
        default: "Set up your workspace in a few minutes and invite the team when it feels right."

    primary_text:
        type: text
        label: Primary button text
        default: "Create account"

    primary_url:
        type: url
        label: Primary button link
        default: "#"

    show_secondary:
        type: toggle
        label: Show secondary button
        default: true

    secondary_text:
        type: text
        label: Secondary button text
        default: "Talk to us"

    secondary_url:
        type: url
        label: Secondary button link
        default: "#"
