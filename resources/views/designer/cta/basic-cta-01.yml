name: basic-cta-01
title: Basic CTA 01
description: Centered heading, supporting text, and two buttons in a bordered panel
category: cta
tags:
    - basic
    - cta
    - panel
    - buttons

fields:
    heading:
        type: text
        label: Heading
        default: "Start building today"
        required: true

    text:
        type: textarea
        label: Supporting text
        description: Short line under the heading. Clear to hide.
        default: "Create a free account and publish your first page in minutes. No credit card required."

    primary_text:
        type: text
        label: Primary button text
        default: "Get started"

    primary_url:
        type: url
        label: Primary button link
        default: "#"

    show_secondary:
        type: toggle
        label: Show secondary button
        default: true

    secondary_text:
        type: text
        label: Secondary button text
        default: "View pricing"

    secondary_url:
        type: url
        label: Secondary button link
        default: "#"
