name: gallery-masonry
title: Masonry gallery
description: Column-flow photo grid with small captions
category: gallery
tags:
    - gallery
    - masonry
    - photos
    - images

fields:
    eyebrow:
        type: text
        label: Eyebrow
        description: Small uppercase label above the heading. Clear to hide.
        default: "The workshop"

    heading:
        type: text
        label: Heading
        default: "A year on the studio floor"
        required: true

    subheading:
        type: textarea
        label: Subheading
        rows: 2
        default: "Commissions, prototypes, and the occasional happy accident — photographed between January and June."

    images:
        type: repeater
        label: Images
        add_button_label: Add image
        sub_fields:
            image:
                type: image
                label: Image
                default: "https://picsum.photos/seed/gallery-new/800/800"
            caption:
                type: text
                label: Caption
                description: Shown under the photo. Clear to hide.
                default: ""
        default:
            - image: "https://picsum.photos/seed/gallery-walnut/800/1000"
              caption: "Walnut credenza, commission no. 84"
            - image: "https://picsum.photos/seed/gallery-benchroom/800/600"
              caption: "The bench room at opening hour"
            - image: "https://picsum.photos/seed/gallery-kiln/800/800"
              caption: "Second firing, kiln two"
            - image: "https://picsum.photos/seed/gallery-drafting/800/1100"
              caption: "Drafting the June collection"
            - image: "https://picsum.photos/seed/gallery-glaze/800/650"
              caption: "Glaze tests for the coastal series"
            - image: "https://picsum.photos/seed/gallery-crates/800/900"
              caption: "Crated and headed to Chicago"
