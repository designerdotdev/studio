name: basic-footer-03
title: Basic Footer 03
description: Centered footer with logo, one nav row, social icons, and copyright
category: footers
tags:
    - basic
    - footer
    - centered

fields:
    logo_svg:
        type: textarea
        label: Logo SVG
        rows: 3
        description: Paste inline SVG markup. Clear it to show the company name only.
        default: '<svg class="h-6 w-6 text-neutral-950" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><rect width="32" height="32" rx="8"></rect></svg>'

    company_name:
        type: text
        label: Company name
        default: "Acme"
        required: true

    links:
        type: repeater
        label: Nav links
        add_button_label: Add link
        sub_fields:
            text:
                type: text
                label: Text
                default: "Link"
            url:
                type: url
                label: URL
                default: "#"
        default:
            - text: "Features"
              url: "#"
            - text: "Pricing"
              url: "#"
            - text: "About"
              url: "#"
            - text: "Blog"
              url: "#"
            - text: "Careers"
              url: "#"
            - text: "Contact"
              url: "#"

    show_social:
        type: toggle
        label: Show social icons
        default: true

    copyright:
        type: text
        label: Copyright
        default: "© 2026 Acme, Inc. All rights reserved."
