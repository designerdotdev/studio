name: footer-columns
title: Footer with link columns
description: Brand block and social icons beside nestable link columns
category: footers
tags:
    - footer
    - links
    - columns

fields:
    logo_svg:
        type: textarea
        label: Logo SVG
        rows: 3
        description: Paste inline SVG markup. Clear it to show the company name only.
        default: '<svg class="h-6 w-6 text-neutral-950" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none"><path fill="currentColor" fill-rule="evenodd" d="M16 0C7.163 0 0 7.163 0 16s7.163 16 16 16 16-7.163 16-16S24.837 0 16 0Zm0 7a9 9 0 1 1 0 18 9 9 0 0 1 0-18Z" clip-rule="evenodd"></path><circle cx="16" cy="16" r="4.5" fill="currentColor"></circle></svg>'

    company_name:
        type: text
        label: Company name
        default: "Acme"
        required: true

    blurb:
        type: textarea
        label: Blurb
        default: "The shared inbox for support and product teams. Every conversation gets an owner, so nothing slips through."

    columns:
        type: repeater
        label: Link columns
        nestable: true
        max_depth: 2
        add_button_label: Add column
        description: Top-level items are column headings. Nest links beneath them.
        sub_fields:
            text:
                type: text
                label: Text
                default: "Link"
            url:
                type: url
                label: URL
                default: "#"
        default:
            - text: "Product"
              url: "#"
              children:
                  - text: "Features"
                    url: "#"
                  - text: "Pricing"
                    url: "#"
                  - text: "Changelog"
                    url: "#"
                  - text: "Docs"
                    url: "#"
            - text: "Company"
              url: "#"
              children:
                  - text: "About"
                    url: "#"
                  - text: "Blog"
                    url: "#"
                  - text: "Careers"
                    url: "#"
                  - text: "Contact"
                    url: "#"
            - text: "Legal"
              url: "#"
              children:
                  - text: "Privacy policy"
                    url: "#"
                  - text: "Terms of service"
                    url: "#"

    copyright:
        type: text
        label: Copyright
        default: "© 2026 Acme, Inc. All rights reserved."
