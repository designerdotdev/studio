name: contact-split
title: Contact split
description: Contact details on the left, decorative message form on the right
category: contact
tags:
    - contact
    - form
    - email
    - support

fields:
    eyebrow:
        type: text
        label: Eyebrow
        description: Small label above the heading. Clear to hide.
        default: "Contact"

    heading:
        type: text
        label: Heading
        default: "Talk to a human"
        required: true

    subheading:
        type: textarea
        label: Subheading
        default: "Questions about pricing, a migration, or something that broke? Write to us — a person on the product team reads every message."

    email:
        type: text
        label: Email address
        description: Clear to hide the row.
        default: "hello@fieldnotes.app"

    phone:
        type: text
        label: Phone number
        description: Clear to hide the row.
        default: "+1 (503) 941-7226"

    address:
        type: textarea
        label: Address
        description: Line breaks are kept. Clear to hide the row.
        default: "812 NW Flanders Street, Suite 340\nPortland, OR 97209"

    button_text:
        type: text
        label: Submit button text
        default: "Send message"

    form_action:
        type: url
        label: Form action URL
        description: Where the form posts to. Leave as # for a decorative form.
        default: "#"

    form_note:
        type: text
        label: Note under button
        description: Clear to hide.
        default: "We reply within two business days."
