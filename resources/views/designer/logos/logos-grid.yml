name: logos-grid
title: Logo grid
description: Heading with an eight-cell bordered grid of text wordmarks
category: logos
tags:
    - logos
    - grid
    - social-proof

fields:
    heading:
        type: text
        label: Heading
        default: "In good company"
        required: true

    subheading:
        type: textarea
        label: Subheading
        default: "Product, operations, and finance teams at these companies plan their week on our platform."

    logos:
        type: repeater
        label: Logos
        add_button_label: Add logo
        description: Rendered as styled text wordmarks. Eight cells fill the grid evenly.
        sub_fields:
            name:
                type: text
                label: Company name
                default: "Company"
        default:
            - name: "Octave"
            - name: "Harborview"
            - name: "Statice"
            - name: "Ledgerline"
            - name: "Windrose"
            - name: "Bellwether"
            - name: "Juniper & Co"
            - name: "Palisade"
