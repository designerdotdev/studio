name: blog-cards
title: Latest articles
description: Three article cards with image, category, date, and excerpt
category: blog
tags:
    - blog
    - articles
    - cards
    - news

fields:
    eyebrow:
        type: text
        label: Eyebrow
        description: Small label above the heading. Clear to hide.
        default: "Blog"

    heading:
        type: text
        label: Heading
        default: "What we've been writing"
        required: true

    subheading:
        type: textarea
        label: Subheading
        default: "Deep dives from engineering, notes from design, and the occasional honest postmortem."

    link_text:
        type: text
        label: View-all link text
        description: Clear to hide the link.
        default: "View all articles"

    link_url:
        type: url
        label: View-all link URL
        default: "#"

    posts:
        type: repeater
        label: Articles
        add_button_label: Add article
        sub_fields:
            title:
                type: text
                label: Title
                default: "A new article"
            excerpt:
                type: textarea
                label: Excerpt
                default: "A short summary of what the article covers."
            category:
                type: text
                label: Category
                default: "Engineering"
            date:
                type: text
                label: Date
                default: "Jul 2, 2026"
            image:
                type: image
                label: Cover image
                default: "https://picsum.photos/seed/blog-new-post/800/500"
            alt:
                type: text
                label: Alt text
                default: "Article cover image"
            url:
                type: url
                label: Article URL
                default: "#"
        default:
            - title: "How we cut our build times by 68%"
              excerpt: "We moved CI to remote caching and split the monolith into 14 independently built packages. The full before-and-after, including the two changes that mattered far more than the rest."
              category: "Engineering"
              date: "Feb 12, 2026"
              image: "https://picsum.photos/seed/blog-build-times/800/500"
              alt: "Red deer stag beside a tree stump at sunrise"
              url: "#"
            - title: "A field guide to design tokens"
              excerpt: "Naming, aliasing, and the three-tier structure we landed on after two false starts — plus the Figma-to-code sync our design team actually keeps up to date."
              category: "Design"
              date: "Apr 3, 2026"
              image: "https://picsum.photos/seed/blog-design-tokens/800/500"
              alt: "Covered pier over the ocean in black and white"
              url: "#"
            - title: "Postmortem: the great cache stampede of March"
              excerpt: "A routine deploy invalidated 2.3 million cache keys at once and took the API down for 41 minutes. What happened, what we got wrong, and the guardrails we added."
              category: "Infrastructure"
              date: "Jun 21, 2026"
              image: "https://picsum.photos/seed/blog-cache-stampede/800/500"
              alt: "Hazy sunset over forested mountain peaks"
              url: "#"
