<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
    .pilot-mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* Cards that light up under the cursor — the ::after layer paints a soft
       bloom at the pointer position Alpine writes into --mx / --my. */
    .pilot-spotlight { position: relative; overflow: hidden; }
    .pilot-spotlight::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
        background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 50%), rgba(15, 15, 14, 0.13), transparent 62%);
    }
    .pilot-spotlight:hover::after { opacity: 1; }
</style>
