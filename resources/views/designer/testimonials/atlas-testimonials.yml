name: atlas-testimonials
title: Atlas testimonial cards
description: Quiet quote cards with initialed avatars on warm paper
category: testimonials
tags:
    - testimonials
    - quotes
    - atlas
    - social-proof

fields:
    heading:
        type: text
        label: Heading
        default: "What our customers say"
        required: true

    subheading:
        type: textarea
        label: Subheading
        default: "Hear from teams who have transformed their workflow."

    testimonials:
        type: repeater
        label: Testimonials
        add_button_label: Add testimonial
        sub_fields:
            quote:
                type: textarea
                label: Quote
                default: "Add the customer's words here."
            name:
                type: text
                label: Name
                default: "Name"
            role:
                type: text
                label: Role & company
                default: "Role, Company"
            initials:
                type: text
                label: Initials
                default: "AB"
        default:
            - quote: "Atlas helped us streamline our operations and scale faster than we imagined. The integration layer is simply unmatched."
              name: "Talia Smith"
              role: "Head of Product, Forma"
              initials: "TS"
            - quote: "Working with Atlas felt like having an extension of our team. They understood our challenges and delivered real results."
              name: "Jordan Rivera"
              role: "CTO, Metricon"
              initials: "JR"
            - quote: "From day one, Atlas brought clarity and momentum to our development pipeline. Major improvement in velocity."
              name: "Samuel Torres"
              role: "Founder, Bloomtech"
              initials: "ST"
            - quote: "The developer experience is thoughtfully crafted. APIs are clean, documentation is great, and support is responsive."
              name: "Aisha Patel"
              role: "DevOps Lead, NovaTech"
              initials: "AP"
