name: pilot-feature-rows
title: Pilot feature rows
description: A spec sheet — one hairlined row per capability, number and title left, detail and four points right
category: features
tags:
    - features
    - pilot
    - rows
    - spec

fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "The runtime"

    heading:
        type: text
        label: Heading
        default: "What Pilot actually gives you"
        required: true

    items:
        type: repeater
        label: Rows
        add_button_label: Add row
        sub_fields:
            number:
                type: text
                label: Number
                default: "08"
            title:
                type: text
                label: Title
                default: "New capability"
            text:
                type: textarea
                label: Description
                rows: 4
                default: "What this does and why it matters."
            point_1:
                type: text
                label: Point one
                default: "First detail"
            point_2:
                type: text
                label: Point two
                default: "Second detail"
            point_3:
                type: text
                label: Point three
                default: "Third detail"
            point_4:
                type: text
                label: Point four
                default: "Fourth detail"
            sample:
                type: textarea
                label: Code sample
                description: Optional. Shows in a monospace panel under the points.
                rows: 2
                default: ""
        default:
            - number: "01"
              title: "The durable loop"
              text: "Plan, call, observe, repeat — with a checkpoint written after every step. Long runs survive deploys, restarts, and the tool that goes down for twenty minutes."
              point_1: "Checkpoint after every step"
              point_2: "Retries with backoff and jitter"
              point_3: "Resume days later from the same state"
              point_4: "Cancel and rewind to any step"
              sample: "run.resume('8f21c')  # picks up at step 3, not step 0"
            - number: "02"
              title: "Typed tools"
              text: "Write an ordinary function. Pilot reads its signature, derives the JSON schema, and validates every call before your code runs — so a hallucinated argument is a caught error, not a production incident."
              point_1: "Schema derived from the signature"
              point_2: "Arguments validated before execution"
              point_3: "Enums and value objects supported"
              point_4: "Tools versioned alongside your code"
              sample: "#[Tool] function refund(string $chargeId, int $amountCents, Reason $reason): Refund"
            - number: "03"
              title: "State that outlives the process"
              text: "Working memory, scratchpads, and intermediate results live in your database, not in a variable. Nothing is lost to a restart, and two workers never disagree about where a run got to."
              point_1: "Postgres, SQLite, or your own driver"
              point_2: "Optimistic locking across workers"
              point_3: "Scratchpads scoped per run"
              point_4: "Automatic pruning on completion"
              sample: ""
            - number: "04"
              title: "Human review, anywhere"
              text: "Some decisions should not be automatic. Drop an approval gate into the loop and the run parks itself, routes to the right person, and continues the moment they sign off."
              point_1: "Gates anywhere in the loop"
              point_2: "Routing to Slack, email, or your own UI"
              point_3: "Runs can wait for days"
              point_4: "Every approval recorded in the trace"
              sample: "await approval('refunds')->from($team)->because('over $500')"
            - number: "05"
              title: "Traces you can replay"
              text: "Every prompt, argument, result, token, and cent is recorded per step. Replay a run against a different model or a changed prompt and diff the two side by side before you ship the change."
              point_1: "Full step-level recording"
              point_2: "Replay against a new model or prompt"
              point_3: "Diff two runs step by step"
              point_4: "OpenTelemetry export"
              sample: ""
            - number: "06"
              title: "Evals in your pipeline"
              text: "Promote any recorded run to a test case. Your suite runs on every pull request and tells you which step regressed, not just that the score moved."
              point_1: "Recorded runs become fixtures"
              point_2: "Assertions per step, not per run"
              point_3: "Runs in GitHub Actions"
              point_4: "Regression attributed to a step"
              sample: ""
            - number: "07"
              title: "Metered spend"
              text: "Cost is attributed to the step that caused it, so you find the expensive loop instead of guessing. Set a ceiling and a run halts rather than quietly billing you for an afternoon."
              point_1: "Per-run and per-step attribution"
              point_2: "Hard budget ceilings that halt"
              point_3: "Cached results reused on retry"
              point_4: "Per-step model routing"
              sample: ""
