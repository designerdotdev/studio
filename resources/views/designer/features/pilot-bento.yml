name: pilot-bento
title: Pilot bento
description: A 2 / 3 / 2 bento — two wide cards with drawn interface fragments, then icon cards laid three and two across
category: features
tags:
    - features
    - pilot
    - bento
    - grid

fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "What’s in the box"

    heading:
        type: text
        label: Heading
        default: "Everything the demo skipped"
        required: true

    text:
        type: textarea
        label: Supporting copy
        rows: 4
        default: "The loop is the easy part. What makes an agent shippable is what happens when a tool times out, a human has to approve something, or you need to explain a decision three weeks later."

    card_1_title:
        type: text
        label: Wide card one — title
        description: Carries the run-trace drawing.
        default: "A loop that survives contact with reality"

    card_1_text:
        type: textarea
        label: Wide card one — description
        rows: 3
        default: "Plan, call, observe, repeat — with retries, backoff, and a checkpoint after every step. A run that hits a dead tool at minute nine resumes from minute nine, not from zero."

    card_1_detail:
        type: text
        label: Wide card one — footnote
        description: Clear to hide.
        default: "Durable for hours or days"

    card_2_title:
        type: text
        label: Wide card two — title
        description: Carries the typed-tool drawing.
        default: "Tools the model cannot misuse"

    card_2_text:
        type: textarea
        label: Wide card two — description
        rows: 3
        default: "Write an ordinary function; Pilot derives the schema from its signature and validates every call against it. Arguments that would not compile never reach your code."

    card_2_detail:
        type: text
        label: Wide card two — footnote
        description: Clear to hide.
        default: "Typed, validated, versioned"

    items:
        type: repeater
        label: Icon cards
        description: Laid out three across, then two across. Five cards fill the grid with no hole.
        add_button_label: Add card
        sub_fields:
            title:
                type: text
                label: Title
                default: "New card"
            text:
                type: textarea
                label: Description
                rows: 3
                default: "What this covers."
            detail:
                type: text
                label: Footnote
                default: ""
            icon:
                type: textarea
                label: Icon SVG
                description: Inline SVG. Use fill='currentColor' so it follows the theme.
                rows: 3
                default: ""
        default:
            - title: "State that outlives the process"
              text: "Working memory, scratchpads, and results persist outside the run, so a restart, a deploy, or a week-long pause costs you nothing."
              detail: ""
              icon: "<svg viewBox='0 0 20 20' class='size-5 fill-current' aria-hidden='true'><path d='M10 2c3.9 0 7 1.1 7 2.5S13.9 7 10 7 3 5.9 3 4.5 6.1 2 10 2ZM3 7.4C4.3 8.4 7 9 10 9s5.7-.6 7-1.6v3.1C17 11.9 13.9 13 10 13s-7-1.1-7-2.5V7.4Zm0 6C4.3 14.4 7 15 10 15s5.7-.6 7-1.6v2.1C17 16.9 13.9 18 10 18s-7-1.1-7-2.5v-2.1Z'/></svg>"
            - title: "Human review, anywhere in the loop"
              text: "Park a run on an approval gate, route it to the right person, and resume exactly where it stopped once they sign off."
              detail: ""
              icon: "<svg viewBox='0 0 20 20' class='size-5 fill-current' aria-hidden='true'><path fill-rule='evenodd' d='M10 1.5 3.5 4v5.5c0 4 2.8 7.6 6.5 9 3.7-1.4 6.5-5 6.5-9V4L10 1.5Zm3.5 6.5a.75.75 0 0 0-1.1-1L9 10.4 7.5 9a.75.75 0 0 0-1 1.1l2 2a.75.75 0 0 0 1 0l4-4Z' clip-rule='evenodd'/></svg>"
            - title: "A trace of every decision"
              text: "Prompts, tool arguments, results, tokens, and cost — recorded per step and replayable against a different model or prompt."
              detail: ""
              icon: "<svg viewBox='0 0 20 20' class='size-5 fill-current' aria-hidden='true'><path d='M3 4.75A.75.75 0 0 1 3.75 4h8.5a.75.75 0 0 1 0 1.5h-8.5A.75.75 0 0 1 3 4.75Zm2 5A.75.75 0 0 1 5.75 9h10.5a.75.75 0 0 1 0 1.5H5.75A.75.75 0 0 1 5 9.75Zm-2 5A.75.75 0 0 1 3.75 14h6.5a.75.75 0 0 1 0 1.5h-6.5A.75.75 0 0 1 3 14.75Z'/></svg>"
            - title: "Evals that run in CI"
              text: "Turn any recorded run into a test case. Pilot re-runs your suite on every change and shows you exactly which step regressed."
              detail: ""
              icon: "<svg viewBox='0 0 20 20' class='size-5 fill-current' aria-hidden='true'><path fill-rule='evenodd' d='M3 4.5A1.5 1.5 0 0 1 4.5 3h11A1.5 1.5 0 0 1 17 4.5v11a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 15.5v-11Zm10.5 3a.75.75 0 0 0-1.1-1L9 9.9 7.6 8.5a.75.75 0 0 0-1.1 1l2 2a.75.75 0 0 0 1 0l4-4Z' clip-rule='evenodd'/></svg>"
            - title: "Runs anywhere you already deploy"
              text: "A library first — inside your app, a queue worker, a cron, or a container. No sidecar, no broker, no new platform to operate."
              detail: ""
              icon: "<svg viewBox='0 0 20 20' class='size-5 fill-current' aria-hidden='true'><path d='M11.98 1.9a.75.75 0 0 0-1.3-.65l-8.5 9.5A.75.75 0 0 0 2.75 12h6.57l-1.3 6.09a.75.75 0 0 0 1.29.66l8.5-9.5A.75.75 0 0 0 17.25 8h-6.57l1.3-6.09Z'/></svg>"
