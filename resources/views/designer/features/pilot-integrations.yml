name: pilot-integrations
title: Pilot integrations
description: A dense hairline tile grid of the models, stores, and queues the product plugs into
category: features
tags:
    - integrations
    - pilot
    - grid
    - tools

fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "Runs where you already run"

    heading:
        type: text
        label: Heading
        default: "A library, not a platform"
        required: true

    text:
        type: textarea
        label: Supporting copy
        rows: 3
        default: "Pilot is a dependency inside your app, not a service you operate. It speaks to the models, stores, and queues you already have."

    items:
        type: repeater
        label: Tools
        add_button_label: Add tool
        sub_fields:
            name:
                type: text
                label: Name
                default: "New tool"
            category:
                type: text
                label: Category
                default: "Category"
            icon:
                type: textarea
                label: Icon SVG
                description: Inline SVG. Use fill='currentColor' so it follows the theme.
                rows: 3
                default: ""
        default:
            - name: "OpenAI"
              category: "Models"
              icon: "<svg viewBox='0 0 20 20' class='size-4 fill-current' aria-hidden='true'><path d='M10 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm0 3.5 4 2.3v4.4l-4 2.3-4-2.3V7.8l4-2.3Z'/></svg>"
