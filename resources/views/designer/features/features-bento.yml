name: features-bento
title: Bento feature grid
description: Asymmetric bento grid with one large showcase cell and smaller tiles
category: features
tags:
    - features
    - bento
    - grid

fields:
    eyebrow:
        type: text
        label: Eyebrow
        description: Small label above the heading. Clear to hide.
        default: "Platform"

    heading:
        type: text
        label: Heading
        default: "Built around how projects actually run"
        required: true

    subheading:
        type: textarea
        label: Subheading
        default: "One shared timeline at the center, with the approvals, capacity checks, and guardrails that keep it honest."

    cells:
        type: repeater
        label: Cells
        add_button_label: Add cell
        description: The first cell becomes the large showcase tile with the decorative preview.
        sub_fields:
            title:
                type: text
                label: Title
                default: "A capability"
            description:
                type: textarea
                label: Description
                default: "A sentence or two on what this unlocks for the team."
        default:
            - title: "Every project on one timeline"
              description: "Drag a task and every dependent date moves with it. Milestones, owners, and blockers stay visible on a single shared view — no more stitching three tools together to see the quarter."
            - title: "Approvals built in"
              description: "Route briefs and designs to the right reviewer in one click. Sign-offs land on the timeline, not in an email thread."
            - title: "Workload at a glance"
              description: "See who has room this week before you assign, so new work lands with someone who can actually take it."
            - title: "Templates for repeat work"
              description: "Turn any project into a template — launch checklists, sprint rituals, onboarding plans — and spin one up in seconds."
            - title: "Security that clears procurement"
              description: "SSO, SCIM provisioning, and region-pinned data residency, with a SOC 2 Type II report available on request."
