name: basic-features-01
title: Basic Features 01
description: Centered heading with a three-column grid of bordered feature cards
category: features
tags:
    - basic
    - features
    - grid
    - cards

fields:
    eyebrow:
        type: text
        label: Eyebrow
        description: Small label above the heading. Clear to hide.
        default: "Features"

    heading:
        type: text
        label: Heading
        default: "Everything you need to get started"
        required: true

    subheading:
        type: textarea
        label: Subheading
        description: Short line under the heading. Clear to hide.
        default: "The core tools are ready on day one — no setup projects, no consultants."

    features:
        type: repeater
        label: Features
        add_button_label: Add feature
        description: Icons are inline SVG — 24×24 viewBox, stroke-width 1.5 keeps them consistent.
        sub_fields:
            icon:
                type: textarea
                label: Icon (inline SVG)
                default: '<svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>'
            title:
                type: text
                label: Title
                default: "A feature"
            description:
                type: textarea
                label: Description
                default: "One sentence on what it does."
        default:
            - icon: '<svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/></svg>'
              title: "Quick setup"
              description: "Connect your account and import existing content in under ten minutes."
            - icon: '<svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>'
              title: "Team permissions"
              description: "Decide who can view, edit, or publish — down to a single page."
            - icon: '<svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg>'
              title: "Built-in analytics"
              description: "See traffic and engagement for every page without adding another tool."
