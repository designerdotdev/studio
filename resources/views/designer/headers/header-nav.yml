name: header-nav
title: Header with navigation
description: Logo, nav links with optional dropdowns, and two actions
category: headers
tags:
    - header
    - navigation
    - navbar
    - menu

fields:
    company_name:
        type: text
        label: Company name
        default: "Acme"
        required: true

    logo_svg:
        type: textarea
        label: Logo SVG
        rows: 3
        description: Paste inline SVG markup. Clear it to show the company name only.
        default: '<svg class="h-6 w-auto -translate-y-px text-neutral-900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 75" fill="none"><path fill="currentColor" fill-rule="evenodd" d="M50 49.822C62.393 48.34 72 37.792 72 25 72 11.193 60.807 0 47 0S22 11.193 22 25H5a5 5 0 0 0-5 5v40a5 5 0 0 0 5 5h40a5 5 0 0 0 5-5V49.822ZM47 50c1.015 0 2.016-.06 3-.178V30a5 5 0 0 0-5-5H22c0 13.807 11.193 25 25 25Z" clip-rule="evenodd"></path></svg>'

    nav_links:
        type: repeater
        label: Navigation links
        nestable: true
        max_depth: 2
        add_button_label: Add link
        description: Nest links under an item to create a dropdown.
        sub_fields:
            text:
                type: text
                label: Link text
                default: "Link"
            url:
                type: url
                label: URL
                default: "#"
        default:
            - text: "Product"
              url: "#"
            - text: "Pricing"
              url: "#"
            - text: "Changelog"
              url: "#"
            - text: "Company"
              url: "#"

    button_1_text:
        type: text
        label: Secondary button text
        default: "Log in"

    button_1_link:
        type: url
        label: Secondary button link
        default: "#"

    button_2_text:
        type: text
        label: Primary button text
        default: "Sign up"

    button_2_link:
        type: url
        label: Primary button link
        default: "#"
