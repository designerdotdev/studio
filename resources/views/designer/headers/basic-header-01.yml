name: basic-header-01
title: Basic Header 01
description: Minimal header with logo left, centered nav, and one button
category: headers
tags:
    - basic
    - header
    - navigation

fields:
    brand_name:
        type: text
        label: Brand name
        default: "Acme"
        required: true

    logo_svg:
        type: textarea
        label: Logo SVG
        rows: 3
        description: Paste inline SVG markup. Clear it to show the brand name only.
        default: '<svg class="h-6 w-6" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="6" fill="#171717"/></svg>'

    nav_links:
        type: repeater
        label: Navigation links
        add_button_label: Add link
        sub_fields:
            text:
                type: text
                label: Link text
                default: "Link"
            url:
                type: url
                label: URL
                default: "#"
        default:
            - text: "Features"
              url: "#"
            - text: "Pricing"
              url: "#"
            - text: "About"
              url: "#"
            - text: "Contact"
              url: "#"

    button_text:
        type: text
        label: Button text
        default: "Get started"

    button_link:
        type: url
        label: Button link
        default: "#"
