name: basic-header-02
title: Basic Header 02
description: Minimal header with right-aligned nav and a ghost plus solid button pair
category: headers
tags:
    - basic
    - header
    - navigation

fields:
    brand_name:
        type: text
        label: Brand name
        default: "Fathom"
        required: true

    logo_svg:
        type: textarea
        label: Logo SVG
        rows: 3
        description: Paste inline SVG markup. Clear it to show the brand name only.
        default: '<svg class="h-6 w-6" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="6" fill="#171717"/></svg>'

    nav_links:
        type: repeater
        label: Navigation links
        add_button_label: Add link
        sub_fields:
            text:
                type: text
                label: Link text
                default: "Link"
            url:
                type: url
                label: URL
                default: "#"
        default:
            - text: "Product"
              url: "#"
            - text: "Pricing"
              url: "#"
            - text: "Customers"
              url: "#"
            - text: "Blog"
              url: "#"

    ghost_button_text:
        type: text
        label: Ghost button text
        description: Clear to hide.
        default: "Log in"

    ghost_button_link:
        type: url
        label: Ghost button link
        default: "#"

    button_text:
        type: text
        label: Solid button text
        default: "Sign up"

    button_link:
        type: url
        label: Solid button link
        default: "#"
