name: header-nav
title: Header Navigation
description: A clean header with logo, navigation links, and two action buttons
category: headers
tags:
    - header
    - navigation
    - navbar

fields:
    company_name:
        type: text
        label: Company Name
        default: "Acme"
        required: true

    logo_svg:
        type: textarea
        label: Logo SVG
        default: '<svg class="text-gray-900 -translate-y-px w-auto h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 75" fill="none"><path fill="currentColor" fill-rule="evenodd" d="M50 49.822C62.393 48.34 72 37.792 72 25 72 11.193 60.807 0 47 0S22 11.193 22 25H5a5 5 0 0 0-5 5v40a5 5 0 0 0 5 5h40a5 5 0 0 0 5-5V49.822ZM47 50c1.015 0 2.016-.06 3-.178V30a5 5 0 0 0-5-5H22c0 13.807 11.193 25 25 25Z" clip-rule="evenodd"></path></svg>'

    nav_links:
        type: repeater
        label: Navigation Links
        nestable: true
        max_depth: 2
        add_button_label: "Add Link"
        sub_fields:
            text:
                type: text
                label: Link Text
                default: "Link"
            url:
                type: text
                label: URL
                default: "#"
        default:
            - text: "Link One"
              url: "#"
            - text: "Link Two"
              url: "#"
            - text: "Link Three"
              url: "#"
            - text: "Link Four"
              url: "#"

    button_1_text:
        type: text
        label: Button 1 Text
        default: "Log in"

    button_1_link:
        type: text
        label: Button 1 Link
        default: "#"

    button_2_text:
        type: text
        label: Button 2 Text
        default: "Sign up"

    button_2_link:
        type: text
        label: Button 2 Link
        default: "#"
