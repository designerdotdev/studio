name: atlas-header
title: Atlas header
description: Fixed frosted navbar with centered rolling links and pill actions
category: headers
fixed: true
tags:
    - header
    - navigation
    - atlas
    - minimal

fields:
    company_name:
        type: text
        label: Company name
        default: "Atlas"
        required: true

    logo_svg:
        type: textarea
        label: Logo SVG
        rows: 3
        description: Paste inline SVG markup. Clear it to show the company name only.
        default: '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 20 20"><path fill="currentColor" d="M19.99 9.96 0 9.963Q.003 9.228.096 8.5q.552-3.734 3.44-6.14A10.7 10.7 0 0 1 5.994.837 9.6 9.6 0 0 1 8.891.06a9.8 9.8 0 0 1 3.001.131c1.404.283 2.735.85 3.907 1.665a10 10 0 0 1 1.887 1.698 9.27 9.27 0 0 1 2.23 4.797q.116.801.074 1.61"/><path fill="#f3f3ee" d="M19.99 9.96q0 .689-.114 1.369H.101L0 9.962z"/><path fill="currentColor" d="M19.876 11.329a10 10 0 0 1-.355 1.433l-19.11.021L.1 11.33z"/><path fill="#f3f3ee" d="M19.522 12.762c-.133.508-.324 1-.57 1.464L.936 14.224q-.316-.702-.525-1.44z"/><path fill="currentColor" d="M18.952 14.226q-.38.742-.843 1.435c-.645.048-1.307.027-1.954.027q-7.2.007-14.422-.001a9 9 0 0 1-.797-1.463z"/><path fill="#f3f3ee" d="M18.109 15.66q-.27.35-.536.699a6 6 0 0 1-.702.738l-13.977-.002a8.5 8.5 0 0 1-1.16-1.408q7.22.007 14.42.001c.648 0 1.31.021 1.955-.027"/><path fill="currentColor" d="M16.871 17.097a9.862 9.862 0 0 1-5.77 2.816q-.729.08-1.464.086a11 11 0 0 1-1.142-.076 7 7 0 0 1-.952-.17 9 9 0 0 1-.928-.267 9.6 9.6 0 0 1-3.721-2.39z"/></svg>'

    badge_text:
        type: text
        label: Badge
        description: Small pill next to the name. Clear to hide.
        default: "beta"

    nav_links:
        type: repeater
        label: Navigation links
        add_button_label: Add link
        sub_fields:
            text:
                type: text
                label: Link text
                default: "Link"
            url:
                type: url
                label: URL
                default: "#"
        default:
            - text: "Features"
              url: "#features"
            - text: "Pricing"
              url: "#pricing"
            - text: "Testimonials"
              url: "#testimonials"
            - text: "FAQ"
              url: "#faq"

    button_1_text:
        type: text
        label: Secondary button text
        default: "Log in"

    button_1_link:
        type: url
        label: Secondary button link
        default: "#"

    button_2_text:
        type: text
        label: Primary button text
        default: "Sign Up"

    button_2_link:
        type: url
        label: Primary button link
        default: "#"
