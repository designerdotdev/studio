name: header-simple
title: Minimal centered header
description: Wordmark left, quiet links right — no buttons
category: headers
tags:
    - header
    - navigation
    - minimal

fields:
    company_name:
        type: text
        label: Company name
        default: "Foundry"
        required: true

    tagline:
        type: text
        label: Tagline
        description: Small text shown next to the name. Clear to hide.
        default: "Design practice"

    nav_links:
        type: repeater
        label: Navigation links
        add_button_label: Add link
        sub_fields:
            text:
                type: text
                label: Link text
                default: "Link"
            url:
                type: url
                label: URL
                default: "#"
        default:
            - text: "Work"
              url: "#"
            - text: "Services"
              url: "#"
            - text: "Journal"
              url: "#"
            - text: "Contact"
              url: "#"
