name: stats-simple
title: Stat row
description: Centered heading with a four-column row of headline numbers
category: stats
tags:
    - stats
    - numbers
    - metrics

fields:
    heading:
        type: text
        label: Heading
        default: "Numbers that back it up"
        required: true

    subheading:
        type: textarea
        label: Subheading
        default: "We publish our usage and reliability figures every quarter. Here is where things stand."

    stats:
        type: repeater
        label: Stats
        add_button_label: Add stat
        description: The note is a small line under the label — leave it empty to hide it.
        sub_fields:
            value:
                type: text
                label: Value
                default: "42%"
            label:
                type: text
                label: Label
                default: "What this number measures"
            note:
                type: text
                label: Note
                default: ""
        default:
            - value: "$318M"
              label: "Processed through the platform"
              note: "Trailing 12 months"
            - value: "12,400+"
              label: "Teams run their work here"
              note: "Across 84 countries"
            - value: "99.95%"
              label: "Uptime over the last year"
              note: "Independently monitored"
            - value: "4.8/5"
              label: "Average customer rating"
              note: "From 2,163 reviews"
