name: basic-faq-01
title: Basic FAQ 01
description: Heading with a plain bordered accordion of questions
category: faq
tags:
    - basic
    - faq
    - accordion

fields:
    heading:
        type: text
        label: Heading
        default: "Frequently asked questions"
        required: true

    subheading:
        type: textarea
        label: Subheading
        description: Short line under the heading. Clear to hide.
        default: "Quick answers about plans, billing, and getting your data in and out."

    faqs:
        type: repeater
        label: Questions
        add_button_label: Add question
        sub_fields:
            question:
                type: text
                label: Question
                default: "A question"
            answer:
                type: textarea
                label: Answer
                default: "A clear, direct answer."
        default:
            - question: "Can I try it before paying?"
              answer: "Yes — every workspace starts with a 14-day trial of the full product, no credit card needed. When it ends you can pick a plan or stay on the free tier with up to two projects."
            - question: "How does pricing work?"
              answer: "One flat price per workspace, billed monthly or annually. Annual billing takes two months off the total, and you can switch between the two from the billing page at any point."
            - question: "Can I change plans later?"
              answer: "Upgrades apply immediately and we prorate the difference on your next invoice. Downgrades take effect at the end of the current billing period, so you never lose time you already paid for."
            - question: "Is my data portable?"
              answer: "Always. You can export everything as CSV or JSON from settings in a couple of minutes, and if you close your account the export stays available for 30 days before deletion."
            - question: "What kind of support do you offer?"
              answer: "Email support on every plan with replies within one business day, plus a shared Slack channel on annual plans. The docs cover most setup questions if you'd rather not wait."
