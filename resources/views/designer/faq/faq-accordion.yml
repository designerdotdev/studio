name: faq-accordion
title: FAQ accordion
description: Expandable questions in a narrow column with a support link below
category: faq
tags:
    - faq
    - accordion
    - questions
    - support

fields:
    eyebrow:
        type: text
        label: Eyebrow
        description: Small label above the heading. Clear to hide.
        default: "Support"

    heading:
        type: text
        label: Heading
        default: "Frequently asked questions"
        required: true

    subheading:
        type: textarea
        label: Subheading
        default: "Straight answers about billing, trials, security, and what happens to your data if you ever leave."

    support_text:
        type: text
        label: Support line text
        description: Shown under the questions, right before the link.
        default: "Still stuck?"

    support_link_text:
        type: text
        label: Support link text
        default: "Email our support team"

    support_link_url:
        type: url
        label: Support link URL
        default: "#"

    faqs:
        type: repeater
        label: Questions
        add_button_label: Add question
        sub_fields:
            question:
                type: text
                label: Question
                default: "A question"
            answer:
                type: textarea
                label: Answer
                default: "A clear, direct answer."
        default:
            - question: "How does billing work?"
              answer: "Plans are billed per workspace, not per seat, so the price doesn't creep as your team grows. Pay monthly or annually — annual plans get two months free — and every invoice is available from the billing page."
            - question: "Do you offer a free trial?"
              answer: "Every new workspace starts with 14 days of the Business plan, no credit card required. When the trial ends you keep everything you built — pick a paid plan, or continue on the free tier with up to three projects."
            - question: "How do you keep our data secure?"
              answer: "Data is encrypted in transit with TLS 1.3 and at rest with AES-256. We're SOC 2 Type II audited, run third-party penetration tests twice a year, and Business plans can enforce SSO with SAML and SCIM provisioning."
            - question: "Can I export my data?"
              answer: "Any time, from workspace settings. Exports arrive as JSON or CSV within a few minutes and include full revision history. If you close your account, a final export stays available for 30 days before everything is deleted."
            - question: "What happens if I cancel?"
              answer: "Cancel from the billing page in two clicks — no retention call, no email chain. Your plan stays active until the end of the period you've paid for, then the workspace drops to the free tier instead of disappearing."
