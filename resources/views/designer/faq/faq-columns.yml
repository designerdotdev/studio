name: faq-columns
title: FAQ two columns
description: Six questions and answers in a static two-column grid
category: faq
tags:
    - faq
    - questions
    - grid
    - columns

fields:
    eyebrow:
        type: text
        label: Eyebrow
        description: Small label above the heading. Clear to hide.
        default: "FAQ"

    heading:
        type: text
        label: Heading
        default: "Questions, answered"
        required: true

    subheading:
        type: textarea
        label: Subheading
        default: "The details teams ask about before rolling us out — plans, people, integrations, and where your data lives."

    faqs:
        type: repeater
        label: Questions
        add_button_label: Add question
        sub_fields:
            question:
                type: text
                label: Question
                default: "A question"
            answer:
                type: textarea
                label: Answer
                default: "A clear, direct answer."
        default:
            - question: "Can I change plans later?"
              answer: "Any time. Upgrades take effect immediately and we prorate the difference; downgrades apply at the start of your next billing cycle. Nothing is deleted either way — features simply lock until you upgrade again."
            - question: "Is there a limit on team members?"
              answer: "The Starter plan includes up to 10 people. Growth and Business plans are unlimited — you pay one flat workspace price, so inviting the whole company doesn't change the bill."
            - question: "Do you integrate with the tools we already use?"
              answer: "We ship native integrations for Slack, GitHub, Linear, Figma, and Google Calendar, plus a REST API and webhooks for anything custom. Most teams are fully connected within an afternoon."
            - question: "Can we import data from another tool?"
              answer: "Yes — importers for Trello, Asana, and Jira bring over boards, assignees, and attachments automatically. For anything else, upload a CSV and map the columns yourself."
            - question: "What kind of support do you offer?"
              answer: "Every plan includes email support with same-day replies on weekdays. Business plans add a shared Slack channel with a 4-hour response target, staffed by the engineers who build the product."
            - question: "Where is my data hosted?"
              answer: "In your choice of the EU (Frankfurt) or the US (Virginia), picked when you create the workspace. Backups run every 6 hours and are stored encrypted in a second region."
