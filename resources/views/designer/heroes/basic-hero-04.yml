name: basic-hero-04
title: Basic Hero 04
description: Left-aligned hero with a full-width image and a row of stats
category: heroes
tags:
    - basic
    - hero
    - stats
    - image

fields:
    heading:
        type: text
        label: Heading
        default: "The workspace where teams get things done"
        required: true

    text:
        type: textarea
        label: Description
        default: "One place for planning, tracking, and shipping work — trusted by teams of every size."

    button_text:
        type: text
        label: Primary button text
        description: Clear to hide.
        default: "Start free"

    button_link:
        type: url
        label: Primary button link
        default: "#"

    button_text_2:
        type: text
        label: Secondary button text
        description: Clear to hide.
        default: "Book a demo"

    button_link_2:
        type: url
        label: Secondary button link
        default: "#"

    image:
        type: image
        label: Image
        default: "https://placehold.co/2400x1000/f4f4f5/a1a1aa?text=Image"

    image_alt:
        type: text
        label: Image alt text
        default: "Placeholder image"

    stats:
        type: repeater
        label: Stats
        add_button_label: Add stat
        sub_fields:
            value:
                type: text
                label: Value
                default: "1,000+"
            label:
                type: text
                label: Label
                default: "A short label"
        default:
            - value: "4,200+"
              label: "Teams onboard"
            - value: "98.2%"
              label: "Support satisfaction"
            - value: "36"
              label: "Countries served"
            - value: "4.8/5"
              label: "Average app rating"
