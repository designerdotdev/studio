name: hero-basic
title: Centered hero
description: Two-line headline, description, CTAs, and a dashboard mock
category: heroes
tags:
    - hero
    - landing
    - centered

fields:
    heading_text_line_1:
        type: text
        label: Heading line 1
        default: "Build faster."
        required: true

    heading_text_line_2:
        type: text
        label: Heading line 2
        default: "Ship smarter."

    text:
        type: textarea
        label: Description
        default: "Build pages, edit content, and control layouts. All inside of our visual editor built for developers."

    button_text:
        type: text
        label: Primary button text
        default: "Start building for free"

    button_link:
        type: url
        label: Primary button link
        default: "#"

    button_text_2:
        type: text
        label: Secondary button text
        default: "Watch demo"

    button_link_2:
        type: url
        label: Secondary button link
        default: "#"

    social_proof_text:
        type: text
        label: Social proof text
        description: Clear to hide the avatars and stars row.
        default: "Loved by 2,000+ developers"

    show_mockup:
        type: toggle
        label: Show dashboard mockup
        default: true
