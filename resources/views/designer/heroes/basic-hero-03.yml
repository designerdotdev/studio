name: basic-hero-03
title: Basic Hero 03
description: Centered heading with an email signup row and a full-width image below
category: heroes
tags:
    - basic
    - hero
    - email
    - image

fields:
    heading:
        type: text
        label: Heading
        default: "Be first in line when we launch"
        required: true

    text:
        type: textarea
        label: Description
        default: "Join the waitlist and we will send you an invite as soon as your workspace is ready."

    input_placeholder:
        type: text
        label: Email input placeholder
        default: "Enter your email"

    button_text:
        type: text
        label: Button text
        default: "Join the waitlist"

    note:
        type: text
        label: Small note below the form
        description: Clear to hide.
        default: "Free while in beta. No credit card required."

    image:
        type: image
        label: Image
        default: "https://placehold.co/2400x1200/f4f4f5/a1a1aa?text=Image"
