name: hero-split
title: Split hero with image
description: Headline and checklist on the left, image on the right
category: heroes
tags:
    - hero
    - split
    - image

fields:
    badge_text:
        type: text
        label: Badge text
        description: Small pill above the heading. Clear to hide.
        default: "New — Autumn release"

    heading:
        type: text
        label: Heading
        default: "Plan work without the busywork"
        required: true

    text:
        type: textarea
        label: Description
        default: "One shared timeline for projects, approvals, and launches. Your team sees the same plan, in real time, from anywhere."

    button_text:
        type: text
        label: Primary button text
        default: "Start planning"

    button_link:
        type: url
        label: Primary button link
        default: "#"

    button_text_2:
        type: text
        label: Secondary button text
        default: "Talk to sales"

    button_link_2:
        type: url
        label: Secondary button link
        default: "#"

    bullets:
        type: repeater
        label: Checklist
        add_button_label: Add point
        sub_fields:
            text:
                type: text
                label: Text
                default: "A benefit"
        default:
            - text: "Unlimited projects and guests"
            - text: "Timeline, board, and calendar views"
            - text: "SOC 2 Type II compliant"

    image:
        type: image
        label: Image
        default: "https://picsum.photos/seed/hero-split-product/1160/1000"

    image_alt:
        type: text
        label: Image alt text
        default: "White mug of coffee on a bright red background"
