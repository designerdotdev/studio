name: pilot-hero
title: Pilot hero
description: Left-aligned opening statement over the Pilot Console — a three-pane agent window with a terminal, standing on a painted landscape
category: heroes
tags:
    - hero
    - pilot
    - console
    - landing

fields:
    heading:
        type: text
        label: Heading
        default: "Pilot is the runtime for agents you can actually ship."
        required: true

    text:
        type: textarea
        label: Supporting copy
        rows: 3
        default: "Define an agent in a few lines, hand it tools, and Pilot runs the loop — retries, state, human review, and a trace of every decision it made."

    button_1_text:
        type: text
        label: Primary button text
        default: "Get started"

    button_1_link:
        type: url
        label: Primary button link
        default: "/pricing"

    button_2_text:
        type: text
        label: Secondary button text
        default: "Read the guides"

    button_2_link:
        type: url
        label: Secondary button link
        default: "/guides"

    stage_image:
        type: image
        label: Stage painting
        description: The full-bleed band the console stands on. Clear for bare canvas.
        default: "/studio-uploads/designer/pilot-hero-stage.jpg"

    console_title:
        type: text
        label: Window title
        default: "Pilot Console"

    runs_label:
        type: text
        label: Queue label
        default: "Running"

    runs_count:
        type: text
        label: Queue count
        default: "4"

    runs:
        type: repeater
        label: Runs
        description: The queue on the left and the trace list on the right. Set Active to highlight one.
        add_button_label: Add run
        sub_fields:
            label:
                type: text
                label: Run name
                default: "New run"
            meta:
                type: text
                label: Status line
                default: "queued"
            active:
                type: select
                label: Active
                options:
                    "": "No"
                    "1": "Yes"
                default: ""
        default:
            - label: "Backfill customer embeddings"
              meta: "running · 3m 40s"
              active: "1"
            - label: "Reconcile Stripe payouts"
              meta: "needs review · +212 −40"
              active: ""
            - label: "Draft the release notes"
              meta: "done · 1m 02s"
              active: ""
            - label: "Triage overnight errors"
              meta: "queued"
              active: ""

    active_run:
        type: text
        label: Active run title
        default: "Backfill customer embeddings"

    prompt_text:
        type: textarea
        label: The prompt
        rows: 3
        default: "Backfill embeddings for every customer record created before March, then verify the index is complete."

    trace_1:
        type: text
        label: Trace line one
        default: "Read schema/customers.sql"

    trace_2:
        type: text
        label: Trace line two
        default: "Planned 3 steps · 1 subagent"

    trace_3:
        type: text
        label: Trace line three
        default: "Thought for 6s"

    assistant_text:
        type: textarea
        label: The agent's reply
        rows: 3
        default: "Batching 41,880 records at 500 per call. I will checkpoint after every batch so a failure resumes instead of restarting."

    files:
        type: repeater
        label: Files touched
        add_button_label: Add file
        sub_fields:
            path:
                type: text
                label: Path
                default: "app/NewFile.php"
            added:
                type: text
                label: Lines added
                default: "0"
            removed:
                type: text
                label: Lines removed
                default: "0"
        default:
            - path: "jobs/BackfillEmbeddings.php"
              added: "84"
              removed: "0"
            - path: "services/EmbeddingClient.php"
              added: "36"
              removed: "12"
            - path: "tests/BackfillTest.php"
              added: "58"
              removed: "0"

    output_label:
        type: text
        label: Right pane label
        default: "Trace"

    terminal_title:
        type: text
        label: Terminal title
        default: "pilot run"

    terminal_1:
        type: text
        label: Terminal line one
        default: "batch 84/84  ·  41,880 embedded"

    terminal_2:
        type: text
        label: Terminal line two
        default: "verify: index complete, 0 gaps"

    terminal_3:
        type: text
        label: Terminal line three
        default: "done in 4m 12s  ·  $1.94"
