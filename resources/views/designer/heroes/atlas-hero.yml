name: atlas-hero
title: Atlas hero
description: Serif headline over a warm photographic backdrop with floating integration cards
category: heroes
tags:
    - hero
    - atlas
    - serif
    - landing

fields:
    badge_text:
        type: text
        label: Badge
        description: Small status pill above the headline. Clear to hide.
        default: "Now in Public Beta"

    heading:
        type: text
        label: Heading
        default: "The foundation for your next idea"
        required: true

    text:
        type: textarea
        label: Description
        default: "Everything you need to plan, build, and launch your next project. This is the foundation for your next great idea."

    button_1_text:
        type: text
        label: Primary button text
        default: "Get Started"

    button_1_link:
        type: url
        label: Primary button link
        default: "#pricing"

    button_2_text:
        type: text
        label: Secondary button text
        default: "Learn More"

    button_2_link:
        type: url
        label: Secondary button link
        default: "#features"

    background_image:
        type: image
        label: Background image
        description: Fades into the page background. Clear for a plain backdrop.
        default: "/studio-uploads/designer/atlas-hero-bg.jpg"

    show_integrations:
        type: toggle
        label: Show integration cards
        default: true
