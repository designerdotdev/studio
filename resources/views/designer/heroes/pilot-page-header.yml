name: pilot-page-header
title: Pilot page header
description: Left-aligned opening block for inner pages, with an optional stat beside the heading
category: heroes
tags:
    - hero
    - pilot
    - page-header
    - inner-page

fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "The runtime"

    heading:
        type: text
        label: Heading
        default: "Everything the demo skipped"
        required: true

    text:
        type: textarea
        label: Supporting copy
        rows: 3
        default: "The loop is the easy part. Here is exactly what Pilot gives you, what it expects from your code, and what it deliberately leaves alone."

    show_meta:
        type: toggle
        label: Show the stat beside the heading
        default: true

    meta_value:
        type: text
        label: Stat value
        default: "7"

    meta_label:
        type: text
        label: Stat label
        default: "parts, one dependency"
