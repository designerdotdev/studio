name: basic-team-01
title: Basic Team 01
description: Simple grid of members with placeholder avatar, name, and role
category: team
tags:
    - basic
    - team
    - people

fields:
    heading:
        type: text
        label: Heading
        default: "The team"
        required: true

    subheading:
        type: textarea
        label: Subheading
        description: Short line under the heading. Clear to hide.
        default: "Fourteen people across four time zones, building the tool we always wanted at our last jobs."

    members:
        type: repeater
        label: Members
        add_button_label: Add member
        sub_fields:
            image:
                type: image
                label: Photo
                default: "https://placehold.co/144x144/f4f4f5/a1a1aa?text=%E2%80%A2"
            name:
                type: text
                label: Name
                default: "A name"
            role:
                type: text
                label: Role
                default: "Role"
        default:
